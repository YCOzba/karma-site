<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KATMAN — Arşiv</title>
<meta name="description" content="KATMAN — Günlük Mühendislik ve Mimari Gazetesi. Geçmiş sayılar arşivi.">
<style>
  :root{
    --news:#F4F1E9;      /* newsprint */
    --news-dim:#E8E3D6;
    --ink:#14120F;
    --ink-soft:#4a453c;
    --ink-faint:#8b8478;
    --rule:#14120F;
    --serif:Georgia,"Times New Roman","Liberation Serif",serif;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--news);
    color:var(--ink);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    padding:clamp(1.2rem,4vw,2.5rem) clamp(1rem,5vw,3rem) 4rem;
  }
  .sheet{max-width:1000px;margin:0 auto}

  /* ---------------- masthead ---------------- */
  .top{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:1rem;margin-bottom:1.4rem;
  }
  a.back{
    font-family:var(--sans);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--ink-soft);
    padding-bottom:2px;transition:color .15s,border-color .15s;
  }
  a.back:hover{color:var(--ink);border-color:var(--ink)}
  .top .edition{
    font-family:var(--sans);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-faint);text-align:right;
  }

  .masthead{border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);padding:1.5rem 0 .5rem;text-align:center}
  .masthead h1{
    font-size:clamp(2.6rem,11vw,6rem);font-weight:700;line-height:.9;
    letter-spacing:.16em;text-indent:.16em;   /* indent cancels the trailing letter-space */
  }
  .masthead .slogan{
    font-style:italic;font-size:clamp(.85rem,2.2vw,1.05rem);
    color:var(--ink-soft);margin-top:.55rem;
  }
  .masthead .strap{
    display:flex;justify-content:center;gap:clamp(.8rem,3vw,2rem);flex-wrap:wrap;
    font-family:var(--sans);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-faint);margin:.9rem 0 .5rem;
  }
  .rule-double{border-top:1px solid var(--rule);margin-top:3px}

  .archive-label{
    font-family:var(--sans);font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--ink-soft);text-align:center;margin:1.3rem 0 .2rem;
  }

  /* ---------------- the list ---------------- */
  .issues{border-top:1px solid var(--rule);margin-top:1.2rem}
  .issue{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:.3rem clamp(1rem,4vw,2.6rem);
    width:100%;text-align:left;
    background:none;border:0;border-bottom:1px solid rgba(20,18,15,.28);
    padding:clamp(1.1rem,2.6vw,1.6rem) .2rem;
    cursor:pointer;color:inherit;font:inherit;
    transition:background-color .15s;
  }
  .issue:hover,.issue:focus-visible{background:var(--news-dim);outline:none}
  .issue:focus-visible{box-shadow:inset 3px 0 0 var(--ink)}

  .issue .no{
    grid-row:1 / span 3;
    font-family:var(--sans);font-size:.64rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-faint);
    padding-top:.35rem;white-space:nowrap;
  }
  .issue .no b{display:block;font-size:1.5rem;letter-spacing:0;color:var(--ink);font-family:var(--serif);font-weight:700}
  .issue .kicker{
    font-family:var(--sans);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  .issue .headline{
    font-size:clamp(1.25rem,3.4vw,2rem);line-height:1.12;font-weight:700;
  }
  .issue:hover .headline{text-decoration:underline;text-underline-offset:3px}
  .issue .date{
    font-family:var(--sans);font-size:.68rem;letter-spacing:.08em;
    color:var(--ink-faint);
  }

  .colophon{
    font-family:var(--sans);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);text-align:center;margin-top:2.2rem;line-height:1.9;
  }

  /* ---------------- reader ---------------- */
  .reader{
    position:fixed;inset:0;z-index:100;display:none;
    background:var(--news);flex-direction:column;
  }
  .reader.open{display:flex}
  .reader-bar{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:.7rem clamp(.8rem,3vw,1.4rem);
    border-bottom:1px solid var(--rule);background:var(--news);
  }
  .reader-bar .meta{min-width:0}
  .reader-bar .meta .h{
    font-size:clamp(.9rem,2.4vw,1.15rem);font-weight:700;line-height:1.15;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .reader-bar .meta .d{
    font-family:var(--sans);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);margin-top:.15rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .reader-actions{display:flex;align-items:center;gap:.5rem;flex:none}
  .btn{
    font-family:var(--sans);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink);background:none;border:1px solid var(--rule);
    padding:.45em .8em;cursor:pointer;text-decoration:none;white-space:nowrap;
    transition:background-color .15s,color .15s;
  }
  .btn:hover{background:var(--ink);color:var(--news)}
  .reader-frame{flex:1;min-height:0;background:var(--news-dim)}
  .reader-frame iframe{width:100%;height:100%;border:0;display:block}

  /* on small screens an embedded PDF is close to unreadable, so the
     reader hands the file to the device's own viewer instead */
  .reader-fallback{
    flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:1.1rem;text-align:center;padding:2rem 1.5rem;
  }
  .reader-fallback p{font-size:1rem;line-height:1.5;color:var(--ink-soft);max-width:26rem}
  .reader-fallback .big{
    font-family:var(--sans);font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;
    background:var(--ink);color:var(--news);border:1px solid var(--ink);
    padding:.9em 1.6em;text-decoration:none;
  }
  body.no-embed .reader-frame{display:none}
  body.no-embed .reader-fallback{display:flex}

  @media (max-width:560px){
    .issue{grid-template-columns:1fr;gap:.35rem}
    .issue .no{grid-row:auto;padding-top:0}
    .issue .no b{display:inline;font-size:1rem}
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="top">
    <a class="back" href="/">← geri</a>
    <div class="edition">Arşiv · <span id="count"></span> sayı</div>
  </div>

  <div class="masthead">
    <h1>KATMAN</h1>
    <p class="slogan">Günlük Mühendislik ve Mimari Gazetesi</p>
    <div class="strap">
      <span>Mühendislik</span><span>Mimari</span><span>Altyapı</span><span>Kesinti Günlüğü</span>
    </div>
  </div>
  <div class="rule-double"></div>

  <p class="archive-label">Geçmiş Sayılar</p>

  <div class="issues" id="issues"></div>

  <p class="colophon">
    KATMAN · Günlük Mühendislik ve Mimari Gazetesi<br>
    Sayılar PDF olarak arşivlenmiştir
  </p>
</div>

<!-- ---------------- reader ---------------- -->
<div class="reader" id="reader" role="dialog" aria-modal="true" aria-label="Sayı okuyucu">
  <div class="reader-bar">
    <div class="meta">
      <div class="h" id="rHead"></div>
      <div class="d" id="rDate"></div>
    </div>
    <div class="reader-actions">
      <a class="btn" id="rOpen" href="#" target="_blank" rel="noopener">Yeni sekmede</a>
      <button class="btn" id="rClose" type="button">Kapat ✕</button>
    </div>
  </div>
  <div class="reader-frame" id="rFrame"><iframe id="rIframe" title="Sayı"></iframe></div>
  <div class="reader-fallback" id="rFallback">
    <p id="rWhy"></p>
    <a class="big" id="rOpenBig" href="#" target="_blank" rel="noopener">Sayıyı aç</a>
  </div>
</div>

<script>
/* =====================================================================
   Yeni sayı eklemek: PDF'i issues/ klasörüne at ve aşağıya tek satır
   ekle. Liste en yeniden eskiye kendisi sıralanır.

   Alanlar:
     no       sayı numarası          (ör. '008')
     iso      sıralama için tarih    ('2026-08-21')
     date     ekranda görünen tarih
     kicker   manşet üstü
     headline manşet
     file     issues/ içindeki dosya
     mobile   (isteğe bağlı) küçük ekran için ayrı dosya — varsa
              dar ekranlarda bunun yerine o açılır
   ===================================================================== */
const ISSUES = [
  { no:'008', iso:'2026-08-21', date:'21 Ağustos 2026, Cuma',
    kicker:'Kuantum Sonrası Şifreleme · TLS · SASE',
    headline:'Cloudflare Bütün Ağını Kuantum Sonrası Şifreye Geçirdi',
    file:'katman-2026-08-21.pdf' },

  { no:'007', iso:'2026-08-19', date:'19 Ağustos 2026, Çarşamba',
    kicker:'Cloudflare Gen 13 · Donanım-Yazılım Uyumu',
    headline:'Cloudflare Büyük Önbelleği Bırakıp Çekirdeğe Yöneldi',
    file:'katman-2026-08-19.pdf' },

  { no:'006', iso:'2026-08-15', date:'15 Ağustos 2026, Cumartesi',
    kicker:'TLS Sertifikaları · CA/Browser Forum SC-081v3',
    headline:'Sertifikaların Ömrü 47 Güne İniyor, İnsan Denklemden Çıkıyor',
    file:'katman-2026-08-15.pdf' },

  { no:'005', iso:'2026-08-14', date:'14 Ağustos 2026, Cuma',
    kicker:'Namecheap Kesintisi · 13 Ağustos 2026',
    headline:'Bir Soğutma Arızası, Binlerce Siteyi Haritadan Sildi',
    file:'katman-2026-08-14.pdf' },

  { no:'004', iso:'2026-07-25', date:'25 Temmuz 2026, Cumartesi',
    kicker:'Meta Kesintisi · 22 Temmuz 2026',
    headline:'İnternetin Rehberi Bir Anda Boşaldı',
    file:'katman-2026-07-25.pdf' },

  { no:'003', iso:'2026-07-23', date:'23 Temmuz 2026, Perşembe',
    kicker:'Coinbase Kesintisi · 14 Temmuz 2026',
    headline:'Kendi Kapısını Kilitleyen Sistem',
    file:'katman-2026-07-23.pdf' },

  { no:'002', iso:'2026-07-22', date:'22 Temmuz 2026, Çarşamba',
    kicker:'AWS CloudFront Kesintisi · 16 Temmuz 2026',
    headline:'Tek Bir Ayarın Menzili',
    file:'katman-2026-07-22.pdf' },
];

const DIR = 'issues/';
const SMALL = () => matchMedia('(max-width: 820px)').matches;
/* Embedding is only worth it on a big screen with a PDF viewer. Phones
   render embedded PDFs badly (iOS Safari shows page one and won't
   scroll), and some browsers hand PDFs straight to a download — both
   would leave a blank frame, so those get the open-it-yourself view. */
const CAN_EMBED = () => !SMALL() && navigator.pdfViewerEnabled !== false;

const list = document.getElementById('issues');
const reader = document.getElementById('reader');
const rHead = document.getElementById('rHead');
const rDate = document.getElementById('rDate');
const rOpen = document.getElementById('rOpen');
const rOpenBig = document.getElementById('rOpenBig');
const rIframe = document.getElementById('rIframe');

/* newest first, whatever order the array is written in */
const sorted = [...ISSUES].sort((a, b) => b.iso.localeCompare(a.iso));
document.getElementById('count').textContent = sorted.length;

/* pick the mobile cut when one exists and the screen is small */
function fileFor(it){
  return DIR + (SMALL() && it.mobile ? it.mobile : it.file);
}

sorted.forEach((it) => {
  const b = document.createElement('button');
  b.className = 'issue';
  b.type = 'button';
  b.innerHTML =
    `<div class="no">Sayı<b>${it.no}</b></div>` +
    `<div class="kicker">${it.kicker}</div>` +
    `<div class="headline">${it.headline}</div>` +
    `<div class="date">${it.date}</div>`;
  b.addEventListener('click', () => open_(it));
  list.appendChild(b);
});

let lastFocus = null;
function open_(it){
  lastFocus = document.activeElement;
  const url = fileFor(it);
  rHead.textContent = it.headline;
  rDate.textContent = `Sayı ${it.no} · ${it.date}`;
  rOpen.href = url;
  rOpenBig.href = url;
  /* only load the heavy embed where it can actually be shown */
  const embed = CAN_EMBED();
  document.body.classList.toggle('no-embed', !embed);
  document.getElementById('rWhy').textContent = SMALL()
    ? 'Bu sayı iki sayfalık bir A4 gazetedir. Küçük ekranda gömülü görüntüleyici yerine telefonun kendi PDF okuyucusu çok daha rahat.'
    : 'Bu tarayıcı PDF’leri sayfa içinde göstermiyor. Sayıyı kendi PDF okuyucunda açabilirsin.';
  rIframe.src = embed ? url + '#view=FitH' : 'about:blank';
  reader.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('rClose').focus();
  history.replaceState(null, '', '#sayi-' + it.no);
}
function close_(){
  reader.classList.remove('open');
  rIframe.src = 'about:blank';                 /* stop the PDF plugin in the background */
  document.body.style.overflow = '';
  history.replaceState(null, '', location.pathname);
  if(lastFocus) lastFocus.focus();
}
document.getElementById('rClose').addEventListener('click', close_);
addEventListener('keydown', e => { if(e.key === 'Escape' && reader.classList.contains('open')) close_(); });

/* deep link: /gazete/#sayi-008 opens that issue directly. Also runs on
   hashchange, so pasting a link while the page is already open — or
   using back/forward — lands on the right issue instead of doing
   nothing. */
function fromHash(){
  const want = location.hash.match(/^#sayi-([\w-]+)$/);
  if(!want){
    if(reader.classList.contains('open')) close_();
    return;
  }
  const it = sorted.find(i => i.no === want[1]);
  if(it) open_(it);
}
addEventListener('hashchange', fromHash);
fromHash();
</script>
</body>
</html>
