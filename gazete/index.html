<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gazete — coming soon</title>
<style>
  :root {
    --paper: #f2e9d8;
    --paper-edge: #e7d9bc;
    --ink: #2b2420;
    --ink-soft: #5c5145;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, "Noto Serif", serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  main {
    text-align: center;
    padding: 2rem;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.04em;
    margin: 0 0 0.5rem;
  }

  p {
    color: var(--ink-soft);
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 2rem;
  }

  a {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--paper-edge);
    padding-bottom: 2px;
  }

  a:hover {
    color: #a13d2f;
  }
</style>
</head>
<body>
  <main>
    <h1>gazete</h1>
    <p>coming soon</p>
    <a href="/">back to the entrance</a>
  </main>
</body>
</html>
