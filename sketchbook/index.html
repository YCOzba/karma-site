<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sketchbook — karma</title>
<style>
  :root{
    --paper:#E9E1CE;
    --paper-lit:#F6F0DE;
    --paper-dim:#DCD0B4;
    --wood:#43301F;
    --wood-hi:#5C4430;
    --ink:#211B14;
    --shu:#C6442B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(120% 90% at 50% 30%, #241d15, #14100b 70%);
    color:var(--paper-lit);
    font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,"Times New Roman",serif;
    display:flex;flex-direction:column;align-items:center;
    min-height:100%;
    padding:1.6rem 1rem 2.4rem;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  header{
    width:100%;max-width:520px;
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:1.4rem;
  }
  a.back{
    font-family:system-ui,sans-serif;
    font-size:.78rem;letter-spacing:.1em;
    color:#c9bb9a;text-decoration:none;
    display:flex;align-items:center;gap:.4em;
    transition:color 200ms ease;
  }
  a.back:hover{color:var(--paper-lit)}
  a.back::before{content:"←"}

  .counter{
    font-family:system-ui,sans-serif;
    font-size:.75rem;letter-spacing:.12em;
    color:#c9bb9a;
  }

  h1{
    font-size:1.05rem;font-weight:400;font-style:italic;
    letter-spacing:.06em;color:#e9ddc2;
    margin-bottom:1.6rem;
  }

  /* ---------------------------------------------------------------
     the book. Mechanic adapted from MengTo/sketchbook (github.com/
     MengTo/sketchbook): the turning leaf is not one flat panel on a
     hinge — it's a chain of nested strips whose tangent sweeps through
     an arc, so the sheet curves along its width the way paper actually
     bends. Their version turns two-page spreads; ours turns single
     pages, so each leaf has a blank paper back instead of a second
     image, and both directions pivot at the same spine edge.
  ------------------------------------------------------------------ */
  .stage{
    perspective:2200px;
    width:min(88vw,380px);
    aspect-ratio:7/9;
    position:relative;
    touch-action:pan-y;
  }
  .stage::after{ /* contact shadow on the desk */
    content:"";position:absolute;left:6%;right:6%;bottom:-22px;height:26px;
    background:radial-gradient(50% 100% at 50% 0%, rgba(0,0,0,.5), rgba(0,0,0,0) 75%);
    filter:blur(2px);
    opacity:calc(1 - var(--shade,0) * .4);
  }

  .book{
    position:absolute;inset:0;
    transform-style:preserve-3d;
  }
  .spine{
    position:absolute;left:-8px;top:2%;bottom:2%;width:14px;
    background:linear-gradient(90deg,var(--wood),var(--wood-hi) 60%,var(--wood));
    border-radius:6px 0 0 6px;
    box-shadow:inset 0 0 8px rgba(0,0,0,.5), -2px 4px 10px rgba(0,0,0,.4);
    z-index:1000;
  }

  /* resting pages: flat, stacked, no live physics needed */
  .page{
    position:absolute;inset:0;
    transform-style:preserve-3d;
  }
  .page .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:2px 10px 10px 2px;
    box-shadow:2px 4px 18px rgba(0,0,0,.35), inset 0 0 0 1px rgba(33,27,20,.12);
    overflow:hidden;
  }
  .page .face-front{ background:var(--paper-lit) center / cover no-repeat; }
  .page .face-back{
    transform:rotateY(180deg);
    background:
      repeating-linear-gradient(90deg, rgba(67,48,31,.05) 0 1px, transparent 1px 26px),
      var(--paper-dim);
  }

  /* the turning leaf: N nested strips, curved via a theta+beta sweep */
  .curl{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transform-origin:left center;
    transform:rotateY(var(--tt,0deg));
    z-index:900;
    pointer-events:none;
  }
  .strip{
    position:absolute;top:0;left:0;height:100%;
    width:calc(var(--bw,0px) / var(--n,12));
    transform-style:preserve-3d;
    transform-origin:left center;
  }
  .strip .strip{ left:100%; transform:rotateY(var(--td,0deg)); }
  .strip .face{
    position:absolute;top:0;bottom:0;left:0;right:-1px;
    backface-visibility:hidden;
    background-repeat:no-repeat;
    background-size:var(--bw,0px) 100%;
  }
  .strip .face.front{ border-radius:2px 10px 10px 2px; }
  .strip .face.back{
    transform:rotateY(180deg);
    background-image:none;
    background:
      repeating-linear-gradient(90deg, rgba(67,48,31,.05) 0 1px, transparent 1px 26px),
      var(--paper-dim);
    border-radius:2px 10px 10px 2px;
  }
  .strip .sh{
    position:absolute;inset:0;pointer-events:none;
    background:rgba(33,27,20, var(--dark,0));
  }
  .strip .gl{
    position:absolute;inset:0;pointer-events:none;
    background:#fffaf0;opacity:calc(var(--shade,0) * var(--lit,1) * .18);
  }

  /* click / drag zones, split like a real page edge */
  .zones{position:absolute;inset:0;display:flex;z-index:950}
  .zone{flex:1;background:none;border:0;cursor:grab;padding:0;-webkit-tap-highlight-color:transparent}
  .zone:active{cursor:grabbing}
  .zone:focus-visible{outline:2px solid var(--shu);outline-offset:-4px}

  .chevron{
    position:absolute;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border-radius:50%;
    background:rgba(20,16,11,.55);
    display:flex;align-items:center;justify-content:center;
    color:var(--paper-lit);font-size:.95rem;
    opacity:0;transition:opacity 200ms ease;
    pointer-events:none;
    z-index:960;
  }
  .chevron.left{left:-15px}
  .chevron.right{right:-15px}
  .stage:hover .chevron.show{opacity:1}
  .chevron.hidden{display:none}

  footer.hint{
    margin-top:1.6rem;
    font-family:system-ui,sans-serif;font-size:.7rem;letter-spacing:.08em;
    color:#8a7857;text-align:center;max-width:340px;
  }

  @media (max-width:420px){
    footer.hint{display:none}
  }
</style>
</head>
<body>

  <header>
    <a class="back" href="/">geri</a>
    <span class="counter" id="counter">1 / 5</span>
  </header>

  <h1>eskiz defteri</h1>

  <div class="stage" id="stage">
    <div class="spine" aria-hidden="true"></div>
    <div class="book" id="book"></div>
    <div class="chevron left" id="chevLeft" aria-hidden="true">‹</div>
    <div class="chevron right show" id="chevRight" aria-hidden="true">›</div>
    <div class="zones">
      <button class="zone" id="zonePrev" aria-label="Önceki sayfa"></button>
      <button class="zone" id="zoneNext" aria-label="Sonraki sayfa"></button>
    </div>
  </div>

  <footer class="hint">sürükle ya da kenarlara tıkla, ok tuşları da çalışır</footer>

<script>
  /* ---------- sayfaları buraya ekle: yeni bir çizim eklemek için tek satır yeter ---------- */
  const DIR = 'drawings/';
  const PAGES = [
    { file: '01.svg', alt: 'Eskiz 01' },
    { file: '02.svg', alt: 'Eskiz 02' },
    { file: '03.svg', alt: 'Eskiz 03' },
    { file: '04.svg', alt: 'Eskiz 04' },
    { file: '05.svg', alt: 'Boş sayfa' },
  ];
  PAGES.forEach(p => p.url = DIR + p.file);
  const M = PAGES.length;

  const stage = document.getElementById('stage');
  const book = document.getElementById('book');
  const counter = document.getElementById('counter');
  const chevLeft = document.getElementById('chevLeft');
  const chevRight = document.getElementById('chevRight');
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let idx = 0;          // current resting page
  let turn = null;      // {dir:'next'|'prev', from, to, t}

  /* ---- the turning leaf: nested strips forming a curved surface ----
     adapted from MengTo/sketchbook's curl (index.html, ~line 585-630):
     theta sweeps the leaf 0→180°, beta adds a mid-turn bulge that fans
     the strips apart, so the sheet visibly bends instead of pivoting
     like a flat door. */
  const N = 12;
  const BETA = 0.55;
  let strips = [];
  let curlEl = null;

  function el(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }

  function layout(){ book.style.setProperty('--bw', book.clientWidth + 'px'); }
  addEventListener('resize', layout);

  /* ---------------------------------------------------- resting stack */
  const pageEls = PAGES.map((p, i) => {
    const page = el('div', 'page');
    const front = el('div', 'face face-front');
    front.style.backgroundImage = `url(${p.url})`;
    front.setAttribute('role', 'img');
    front.setAttribute('aria-label', p.alt);
    const back = el('div', 'face face-back');
    page.appendChild(front); page.appendChild(back);
    book.appendChild(page);
    return page;
  });

  function paintRest(){
    pageEls.forEach((p, i) => {
      if(turn && i === turn.from){ p.style.display = 'none'; return; }
      p.style.display = '';
      if(i < idx){ p.style.transform = 'rotateY(-180deg)'; p.style.zIndex = i; }
      else       { p.style.transform = 'rotateY(0deg)';    p.style.zIndex = M - i; }
    });
    counter.textContent = `${idx + 1} / ${M}`;
    chevLeft.classList.toggle('show', idx > 0);
    chevLeft.classList.toggle('hidden', idx === 0);
    chevRight.classList.toggle('show', idx < M - 1);
    chevRight.classList.toggle('hidden', idx === M - 1);
  }

  /* ---------------------------------------------------- the curling leaf */
  function buildCurl(from){
    strips = [];
    const c = el('div', 'curl');
    c.style.setProperty('--n', N);
    let host = c;
    for(let i = 0; i < N; i++){
      const s = el('div', 'strip');
      const front = el('div', 'face front');
      const back = el('div', 'face back');
      front.style.backgroundImage = `url(${PAGES[from].url})`;
      front.style.backgroundPositionX = `calc(var(--bw, 0px) * -${i} / ${N})`;
      front.appendChild(el('div', 'sh'));
      front.appendChild(el('div', 'gl'));
      s.appendChild(front); s.appendChild(back);
      host.appendChild(s);
      host = s;
      strips.push(s);
    }
    return c;
  }

  function applyTurn(t){
    const D = 180 / Math.PI;
    const theta = Math.PI * t;
    const beta = BETA * Math.sin(Math.PI * t);
    const tt = (theta + beta) * D;
    const td = (2 * beta / N) * D;
    const base = turn.dir === 'next' ? -tt : (tt - 180);
    book.style.setProperty('--tt', base.toFixed(2) + 'deg');
    book.style.setProperty('--td', (turn.dir === 'next' ? td : -td).toFixed(3) + 'deg');
    const shade = Math.sin(Math.PI * t);
    stage.style.setProperty('--shade', shade.toFixed(3));
    for(let i = 0; i < strips.length; i++){
      const localDeg = base + (turn.dir === 'next' ? td : -td) * i;
      const lit = Math.abs(Math.cos(localDeg / D));
      strips[i].style.setProperty('--lit', lit.toFixed(3));
      strips[i].querySelector('.sh').style.setProperty('--dark', ((1 - lit) * .5).toFixed(3));
    }
  }

  function paintTurn(){
    if(curlEl) curlEl.remove();
    curlEl = buildCurl(turn.from);
    book.appendChild(curlEl);
    applyTurn(turn.t);
  }

  /* ------------------------------------------------------- spring loop */
  let spring = null, raf = null, last = 0;
  function animateTo(target, onDone, k, c){
    spring = { v: 0, target, done: onDone, k: k || 170, c: c || 26 };
    kick();
  }
  function kick(){ if(raf === null){ last = performance.now(); raf = requestAnimationFrame(tick); } }
  function tick(now){
    raf = null;
    const dt = Math.min(0.032, (now - last) / 1000 || 0.016); last = now;
    if(spring && turn){
      const s = spring;
      const x = turn.t - s.target;
      s.v += (-s.k * x - s.c * s.v) * dt;
      turn.t += s.v * dt;
      if(Math.abs(turn.t - s.target) < 0.003 && Math.abs(s.v) < 0.02){
        turn.t = s.target; spring = null;
        applyTurn(turn.t);
        const d = s.done; d && d();
      } else {
        applyTurn(turn.t);
        raf = requestAnimationFrame(tick);
      }
    }
  }

  /* ----------------------------------------------------- turn control */
  function startTurn(dir, t){
    spring = null;
    if(turn){
      /* a previous turn was interrupted mid-flight: snap it to its
         destination and clean up its leaf before maybe starting a new
         one, so a boundary bounce right after never leaves a stray
         curl or a hidden resting page behind. */
      idx = turn.to; turn = null;
      if(curlEl){ curlEl.remove(); curlEl = null; }
      paintRest();
    }
    if((dir === 'next' && idx >= M - 1) || (dir === 'prev' && idx <= 0)) return false;
    const from = dir === 'next' ? idx : idx - 1;
    const to   = dir === 'next' ? idx + 1 : idx - 1;
    turn = { dir, from, to, t: t || 0 };
    paintRest();
    paintTurn();
    return true;
  }
  function commit(){
    if(!turn) return;
    if(REDUCED){ idx = turn.to; turn = null; if(curlEl){ curlEl.remove(); curlEl = null; } paintRest(); return; }
    animateTo(1, () => { idx = turn.to; turn = null; if(curlEl){ curlEl.remove(); curlEl = null; } paintRest(); }, 170, 26);
  }
  function cancel(){
    if(!turn) return;
    if(REDUCED){ turn = null; if(curlEl){ curlEl.remove(); curlEl = null; } paintRest(); return; }
    animateTo(0, () => { turn = null; if(curlEl){ curlEl.remove(); curlEl = null; } paintRest(); }, 150, 24);
  }
  function step(dir){
    if(startTurn(dir, 0)) commit();
  }
  function next(){ step('next'); }
  function prev(){ step('prev'); }

  /* --------------------------------------------------------- pointer */
  let drag = null;
  stage.addEventListener('pointerdown', e => {
    if(e.button !== 0) return;
    const onZone = e.target.closest('.zone');
    if(!onZone) return;
    e.preventDefault();
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
    const r = book.getBoundingClientRect();
    const dir = (e.clientX - r.left) / r.width > 0.5 ? 'next' : 'prev';
    if(REDUCED){ step(dir); return; }
    if(!startTurn(dir, 0)) return;
    drag = { dir, x0: e.clientX, w: r.width, moved: 0 };
  });
  stage.addEventListener('pointermove', e => {
    if(!drag || !turn) return;
    const dx = e.clientX - drag.x0;
    drag.moved = Math.max(drag.moved, Math.abs(dx));
    const raw = (drag.dir === 'next' ? -dx : dx) / (drag.w * 0.9);
    turn.t = Math.max(0, Math.min(1, raw));
    applyTurn(turn.t);
  });
  function endDrag(){
    if(!drag) return;
    const d = drag; drag = null;
    if(!turn) return;
    if(d.moved < 6){ commit(); return; }
    if(turn.t > 0.42) commit(); else cancel();
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('dragstart', e => e.preventDefault());

  window.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); next(); }
    if(e.key === 'ArrowLeft'  || e.key === 'ArrowUp'){   e.preventDefault(); prev(); }
  });

  layout();
  paintRest();
</script>
</body>
</html>
